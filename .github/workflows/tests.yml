name: Tests

# The pull-request gate for main: the full suite on Linux with the locked
# headless profile, through tools/gate.sh (fail-closed: failures, collection
# errors and timeouts all fail the job). Linux is the fork's primary target
# (Docker server and AppImage).
#
# The macOS job is the upstream project's former gate. It is kept for manual
# runs (workflow_dispatch) only: no support decision has been recorded for
# retiring macOS testing, but a 3-core hosted Mac needs about 70 minutes, so it
# does not run on every pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked headless test profile
        run: python -m pip install -r requirements-dev.txt -c requirements-linux-py312.lock
      - name: Full Linux gate
        env:
          GATE_WORKERS: "4"
          GATE_RERUN_FAILURES: "0"
        run: GATE_PYTHON="$(command -v python)" bash tools/gate.sh "$PWD" linux-ci
      - name: Show verification diagnostics
        if: always()
        run: |
          if test -f /tmp/shepherd-gate/linux-ci.status.txt; then
            cat /tmp/shepherd-gate/linux-ci.status.txt
            tail -n 150 /tmp/shepherd-gate/linux-ci.full.txt
          fi

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@12.11.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the server requirements (locked)
        run: python -m pip install -r requirements-server.txt -c requirements-linux-py312.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@12.11.2 --activate
      - name: Build the UI and install the browser
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Smoke tests against a real backend on throwaway data
        working-directory: web
        env:
          E2E_PYTHON: python
        run: pnpm e2e

  macos:
    name: macOS tests (manual, shard ${{ matrix.shard }} of 2)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-xdist pytest-timeout fitparse Pillow
      - name: Parallel bulk (this shard's files)
        run: |
          FILES=$(ls tests/test_*.py | awk -v s=${{ matrix.shard }} 'NR % 2 == s % 2')
          python -m pytest $FILES -q -p no:cacheprovider -n 3 -m "not release_serial" --timeout=900 -rfE
      - name: Serial tail
        if: matrix.shard == 1
        run: python -m pytest tests -q -p no:cacheprovider -m release_serial --timeout=900 -rfE

name: Tests

# The pull-request gate for main: the full suite on Linux with the locked
# headless profile, through tools/gate.sh (fail-closed: failures, collection
# errors and timeouts all fail the job). Linux is the fork's primary target
# (Docker server and AppImage).
#
# macOS and Windows testing are retired (#26): Linux, run as the Docker image the
# project ships, is the only supported test target.
on:
  pull_request:
    branches: [main]
  # A merge can break main in ways its pull request did not show (v4.0.0-beta.1's Docker build).
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked headless test profile
        run: python -m pip install -r requirements-dev.txt -c requirements-linux-py312.lock
      - name: Full Linux gate
        env:
          GATE_WORKERS: "4"
          GATE_RERUN_FAILURES: "0"
        run: GATE_PYTHON="$(command -v python)" bash tools/gate.sh "$PWD" linux-ci
      - name: Show verification diagnostics
        if: always()
        run: |
          if test -f /tmp/shepherd-gate/linux-ci.status.txt; then
            cat /tmp/shepherd-gate/linux-ci.status.txt
            tail -n 150 /tmp/shepherd-gate/linux-ci.full.txt
          fi

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@12.11.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the server requirements (locked)
        run: python -m pip install -r requirements-server.txt -c requirements-linux-py312.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@12.11.2 --activate
      - name: Build the UI and install the browser
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Smoke tests against a real backend on throwaway data
        working-directory: web
        env:
          E2E_PYTHON: python
        run: pnpm e2e

name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Shepherd is a planner, library and post-ride viewer. It does not control a trainer, and it does not run its own food database or phone app.
        Please check the [roadmap](https://github.com/PACE-1/shepherd/blob/main/docs/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you are trying to do and what gets in the way, before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Planner or plan screens
        - Library or workout builder
        - Analysis or load numbers
        - Cycling
        - Running
        - Swimming or triathlon
        - Strength or mobility
        - Setup, onboarding or Settings
        - Integrations (intervals.icu, nutrition, weather, other)
        - Import, export or backup
        - Phone layout or installed app
        - Docker or AppImage
        - Something else
  - type: textarea
    id: science
    attributes:
      label: Training-science sources
      description: |
        If this involves load, zones, pacing, recovery or any physiology number, link the published method it should follow.
        Features without a citable source are labelled as heuristics or left out.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to help build or test this.
